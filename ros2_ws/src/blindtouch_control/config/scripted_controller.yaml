blindtouch_scripted_controller:
  ros__parameters:
    controller_type: "safe_force"
    output_topic: "blindtouch/raw_command"
    tactile_topic: "blindtouch/tactile"
    joint_state_topic: "blindtouch/joint_states"
    sim_state_topic: "blindtouch/sim_state"
    publish_rate_hz: 25.0
    tactile_force_scale: 5.0
    velocity_scale: 0.5
    max_episode_steps: 120
    target_force: 0.50
    force_band: 0.14
    close_rate: 0.18
    lift_rate: 1.0
    stable_steps_required: 8
    max_probe_steps: 100
